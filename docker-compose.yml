version: '3.8'

services:
  # 1. 데이터베이스(MySQL) 상자
  db:
    image: mysql:8.0
    container_name: ai_meeting_db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-1234}
      MYSQL_DATABASE: ai_meeting
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    restart: always

  # 2. 백엔드(FastAPI) 상자
  backend:
    build: 
      context: ./backend
    container_name: ai_meeting_backend
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_USER=root
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-1234}
      - MYSQL_DATABASE=ai_meeting
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - SMTP_EMAIL=${SMTP_EMAIL}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      - db
    restart: always

  # 3. 프론트엔드(Next.js) 상자
  frontend:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ai_meeting_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - INTERNAL_API_URL=http://backend:8000
      - ASSEMBLY_API_KEY=${ASSEMBLY_API_KEY:-${ASSEMBLYAI_API_KEY}}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MEETING_WEBHOOK_URL=${MEETING_WEBHOOK_URL}
    depends_on:
      - backend
    restart: always

  # 4. HTTPS 문지기 (서버에서 마이크 녹음하려면 필요)
  # PUBLIC_HOST=서버IP 를 .env에 넣고, NEXT_PUBLIC_API_URL=https://서버IP 로 맞춘 뒤 사용
  caddy:
    image: caddy:2-alpine
    container_name: ai_meeting_caddy
    ports:
      - "80:80"
      - "443:443"
    environment:
      - PUBLIC_HOST=${PUBLIC_HOST:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    restart: always
    profiles:
      - https

# 창고 데이터를 영원히 보관하기 위한 설정
volumes:
  db_data:
  caddy_data:
  caddy_config:
