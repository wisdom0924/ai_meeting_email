name: Deploy to Oracle Cloud

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub에서 코드 받기 (비공개 저장소도 여기서는 항상 됨)
      - name: 코드 checkout
        uses: actions/checkout@v4

      # 2. rsync로 서버에 코드 복사 (.env는 서버 것 유지)
      - name: 서버에 코드 동기화
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true

          rsync -avz --delete \
            --exclude '.env' \
            --exclude '.git' \
            --exclude 'node_modules' \
            --exclude '.next' \
            --exclude 'backend/venv' \
            --exclude 'backend/__pycache__' \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no" \
            ./ "${SERVER_USER}@${SERVER_HOST}:~/ai_meeting_email/"

      # 3. 서버에서 Docker 빌드 및 재시작
      - name: Docker 빌드 및 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          command_timeout: 60m
          script: |
            set -ex
            cd ~/ai_meeting_email
            docker compose build backend
            docker compose build frontend
            docker compose --profile https up -d --force-recreate
            docker compose ps
